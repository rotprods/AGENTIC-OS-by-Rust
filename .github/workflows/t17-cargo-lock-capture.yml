name: T17 Cargo Lock Capture

# Temporary evidence compiler. Delete after Cargo.lock is revision-pinned.
on:
  push:
    branches: [feat/graph-refactor-v2-survival]
    paths:
      - '.github/workflows/t17-cargo-lock-capture.yml'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'

permissions:
  contents: write

concurrency:
  group: t17-cargo-lock-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Generate and verify workspace lockfile
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/graph-refactor-v2-survival'
          test ! -e Cargo.lock
          cargo generate-lockfile
          test -s Cargo.lock
          actual="$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "CARGO_LOCK_SHA256=$actual"
          test "$actual" = '46560ba1d5717258a3b7ae922a1230c4225f0316bbaccc599a9437207810632a'
      - name: Persist exact generated lockfile with fast-forward-only push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --exit-code && { echo 'Cargo.lock was not generated'; exit 1; } || true
          git commit -m 'build(t17): pin Cargo dependency graph'
          git push origin HEAD:feat/graph-refactor-v2-survival
