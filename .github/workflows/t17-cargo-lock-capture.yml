name: T17 Cargo Lock Capture

# Temporary evidence compiler. Delete after Cargo.lock is revision-pinned.
on:
  push:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: t17-cargo-lock-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Generate workspace lockfile
        run: |
          test ! -e Cargo.lock
          cargo generate-lockfile
          test -s Cargo.lock
      - name: Emit content-addressed lockfile
        run: |
          echo "CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo 'CARGO_LOCK_BASE64_BEGIN'
          base64 -w 0 Cargo.lock
          echo
          echo 'CARGO_LOCK_BASE64_END'
