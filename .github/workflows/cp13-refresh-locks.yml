name: CP13 Refresh Locks

on:
  push:
    branches: [feat/cp13-supply-chain]

permissions:
  contents: read

jobs:
  refresh-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.88.0'
      - name: Refresh only approved dependency locks
        run: |
          set -euxo pipefail
          cargo update -p time --precise 0.3.47
          cargo metadata --locked --format-version 1 >/dev/null
          corepack enable
          corepack prepare 'pnpm@10.15.0' --activate
          pnpm install --lockfile-only
          grep -F 'ajv@8.18.0' pnpm-lock.yaml
          sha256sum Cargo.lock pnpm-lock.yaml
      - name: Upload refreshed locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cp13-refreshed-locks-${{ github.sha }}
          path: |
            Cargo.lock
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
