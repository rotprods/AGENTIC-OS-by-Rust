name: T17 Python Dependency Capture

# Temporary read-only evidence compiler. Delete after requirements are revision-pinned.
on:
  push:
    branches: [feat/graph-refactor-v2-survival]
    paths:
      - '.github/workflows/t17-python-lock-capture.yml'

permissions:
  contents: read

concurrency:
  group: t17-python-lock-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve in isolated Python environment
        run: |
          python --version
          python -m venv /tmp/t17-venv
          /tmp/t17-venv/bin/python -m pip install --disable-pip-version-check --upgrade 'pip==26.0.1'
          /tmp/t17-venv/bin/python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          /tmp/t17-venv/bin/python -m pip freeze --all | LC_ALL=C sort > /tmp/t17-freeze.txt
          echo 'PYTHON_FREEZE_BEGIN'
          cat /tmp/t17-freeze.txt
          echo 'PYTHON_FREEZE_END'
      - name: Download exact wheels and emit hashes
        run: |
          mkdir /tmp/t17-wheels
          /tmp/t17-venv/bin/python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --dest /tmp/t17-wheels -r /tmp/t17-freeze.txt
          echo 'PYTHON_WHEEL_HASHES_BEGIN'
          for f in $(find /tmp/t17-wheels -maxdepth 1 -type f | LC_ALL=C sort); do
            printf '%s  ' "$(basename "$f")"
            sha256sum "$f" | awk '{print $1}'
          done
          echo 'PYTHON_WHEEL_HASHES_END'
