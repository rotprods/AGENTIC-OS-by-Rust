name: CP11 Lock Bootstrap

on:
  push:
    branches: [feat/cp11-supply-chain]

permissions:
  contents: read

concurrency:
  group: cp11-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Pin Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Generate Rust lock
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Generate hashed Python CI lock
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file requirements/ci.lock \
            requirements/ci.in
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.lock
          python -m pip check

      - name: Preserve bootstrap lock artifacts
        run: |
          mkdir -p .cp11-bootstrap
          cp Cargo.lock .cp11-bootstrap/Cargo.lock
          cp requirements/ci.lock .cp11-bootstrap/ci.lock
          sha256sum .cp11-bootstrap/Cargo.lock .cp11-bootstrap/ci.lock | tee .cp11-bootstrap/SHA256SUMS
          echo '---CP11_CARGO_LOCK_BASE64_BEGIN---'
          base64 -w0 Cargo.lock
          echo
          echo '---CP11_CARGO_LOCK_BASE64_END---'
          echo '---CP11_PYTHON_LOCK_BASE64_BEGIN---'
          base64 -w0 requirements/ci.lock
          echo
          echo '---CP11_PYTHON_LOCK_BASE64_END---'

      - name: Upload bootstrap locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cp11-bootstrap-locks-${{ github.sha }}
          path: .cp11-bootstrap/
          if-no-files-found: error
          retention-days: 7
