name: GGEV2 Realtime Control Plane

on:
  push:
    branches: [feat/ggev2-realtime-control-plane]
  pull_request:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: ggev2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run GGEV2 compiler tests
        env:
          PYTHONPATH: python
        run: python -m unittest python/tests/test_ggev2.py -v
      - name: Validate realtime snapshot schema
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.load(open('ggev2/schema/realtime-state.schema.json'))
          state=json.load(open('ggev2/REALTIME_STATE.json'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(state)
          print('GGEV2 schema: PASS')
          PY
      - name: Assert projection cannot claim canonical authority
        run: |
          python - <<'PY'
          import json
          sources=json.load(open('ggev2/SOURCE_REGISTRY.json'))
          assert all(source['mutable_by_ggev2'] is False for source in sources['sources'])
          assert 'GGEV2_TO_CANONICAL_STATE' in sources['forbidden']
          state=json.load(open('ggev2/REALTIME_STATE.json'))
          assert state['event_watermark'] == 0
          assert state['freshness'] in {'FRESH','STALE','BLOCKED','UNKNOWN'}
          print('GGEV2 authority boundary: PASS')
          PY
