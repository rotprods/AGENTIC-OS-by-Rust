name: Promotion Control Plane Readiness V1

on:
  push:
    branches: [feat/cp14-promotion-readiness-v1, feat/graph-refactor-v2-survival]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to evaluate
        required: true
        type: string
      enforce:
        description: Fail the workflow unless promotion controls are READY
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      enforce:
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: promotion-control-plane-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-control-plane-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON_VERSION: '3.13.15'
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify exact candidate checkout
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(python --version | awk '{print $2}')" = "$PYTHON_VERSION"

      - name: Execute deterministic promotion-policy tests
        env:
          PYTHONPATH: python
        run: |
          python -m compileall -q python/rot_contracts/promotion.py scripts/promotion_readiness_v1.py python/tests/test_promotion_readiness_v1.py
          python -m unittest -v python.tests.test_promotion_readiness_v1

      - name: Collect live fail-closed readiness report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: python
        run: |
          mkdir -p promotion-readiness-evidence
          python scripts/promotion_readiness_v1.py \
            --policy governance/promotion-control-plane.v1.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --live \
            --output promotion-readiness-evidence/report.json \
            --report-only
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload=json.loads(Path('promotion-readiness-evidence/report.json').read_text())
          assert payload['authority']=='DERIVED_NON_AUTHORITATIVE', payload
          assert payload['promotion_authority'] is False, payload
          assert payload['candidate_sha']==os.environ['CANDIDATE_SHA'], payload
          print(f"promotion readiness status={payload['status']} blockers={[x['code'] for x in payload['blockers']]}")
          PY

      - name: Upload promotion-readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-readiness-${{ env.CANDIDATE_SHA }}
          path: promotion-readiness-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Enforce promotion readiness when explicitly requested
        if: ${{ inputs.enforce == true }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('promotion-readiness-evidence/report.json').read_text())
          if payload.get('ready') is not True:
              for blocker in payload.get('blockers', []):
                  print(f"{blocker.get('code')}: {blocker.get('detail')}")
              raise SystemExit('promotion control plane is not READY')
          PY
