name: Capture pnpm lock candidate

on:
  push:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: capture-pnpm-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - name: Generate workspace lockfile without package mutation
        run: pnpm --dir packages/contracts-ts install --lockfile-only --frozen-lockfile=false
      - name: Emit lockfile evidence
        run: |
          test -f pnpm-lock.yaml
          sha256sum pnpm-lock.yaml
          printf 'LOCKFILE_BASE64_BEGIN\n'
          base64 -w0 pnpm-lock.yaml
          printf '\nLOCKFILE_BASE64_END\n'
