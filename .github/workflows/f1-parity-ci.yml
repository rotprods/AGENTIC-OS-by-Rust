name: F1 Cross-Language Parity

on:
  pull_request:
    branches: [feat/graph-refactor-v2-survival, main]
  push:
    branches: [feat/f1-contract-kernel-vnext, feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: f1-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Python golden and schema parity
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
      - name: Enable pnpm
        run: corepack enable
      - name: Install frozen TypeScript workspace dependencies
        run: |
          test -f pnpm-lock.yaml
          cp pnpm-lock.yaml /tmp/pnpm-lock.before
          pnpm install --frozen-lockfile
          cmp pnpm-lock.yaml /tmp/pnpm-lock.before
      - name: Compile TypeScript parity surface
        run: pnpm --dir packages/contracts-ts run build
      - name: TypeScript golden parity
        run: pnpm --dir packages/contracts-ts run verify:goldens
      - name: TypeScript schema parity
        run: pnpm --dir packages/contracts-ts run verify:schemas
      - name: TypeScript Survival V2 behavioral parity
        run: pnpm --dir packages/contracts-ts run verify:survival-behavior
