name: F1 Cross-Language Parity

on:
  pull_request:
    branches: [feat/graph-refactor-v2-survival, main]
  push:
    branches: [feat/f1-contract-kernel-vnext, feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: f1-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_VERSION: '3.13.15'
      NODE_VERSION: '24.20.0'
      PNPM_VERSION: '10.15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked Python parity closure
        run: |
          test "$(python --version | awk '{print $2}')" = "$PYTHON_VERSION"
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.lock
          python -m pip check
      - name: Python golden and schema parity
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
      - name: Pin Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin pnpm runtime
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install frozen TypeScript workspace dependencies
        run: |
          test -f pnpm-lock.yaml
          cp pnpm-lock.yaml /tmp/pnpm-lock.before
          pnpm install --frozen-lockfile
          cmp pnpm-lock.yaml /tmp/pnpm-lock.before
      - name: Compile TypeScript parity surface
        run: pnpm --dir packages/contracts-ts run build
      - name: TypeScript golden parity
        run: pnpm --dir packages/contracts-ts run verify:goldens
      - name: TypeScript schema parity
        run: pnpm --dir packages/contracts-ts run verify:schemas
      - name: TypeScript Survival V2 behavioral parity
        run: pnpm --dir packages/contracts-ts run verify:survival-behavior
      - name: Prove pnpm lockfile did not mutate
        if: always()
        run: cmp pnpm-lock.yaml /tmp/pnpm-lock.before
