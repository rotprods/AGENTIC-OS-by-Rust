name: F1 Rust Contract Kernel

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/f1-contract-kernel-vnext, feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: f1-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-contract-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Verify frozen Cargo dependency graph
        run: |
          test -s Cargo.lock
          actual="$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "CARGO_LOCK_SHA256=$actual"
          test "$actual" = '46560ba1d5717258a3b7ae922a1230c4225f0316bbaccc599a9437207810632a'
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --locked --format-version 1 >/dev/null
          cmp /tmp/Cargo.lock.before Cargo.lock
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Prove Cargo.lock did not mutate
        if: always()
        run: cmp /tmp/Cargo.lock.before Cargo.lock
