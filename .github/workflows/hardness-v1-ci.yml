name: Hardness V1 Self-Hosting Gate

on:
  pull_request:
  push:
    branches: [feat/hardness-v1-self-hosting]

permissions:
  contents: read

concurrency:
  group: hardness-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile Python sources
        run: python -m compileall -q python/rot_ai/hardness.py python/rot_ai/hardness_assurance.py python/rot_ai/hardness_recovery.py python/rot_ai/hardness_supply_chain.py python/rot_ai/autoprompting.py python/rot_ai/ggev2_hardness.py python/tests/test_hardness.py python/tests/test_hardness_properties.py python/tests/test_hardness_assurance.py python/tests/test_hardness_recovery.py python/tests/test_hardness_supply_chain.py python/tests/test_autoprompting.py python/tests/test_ggev2_hardness.py
      - name: Run Hardness self-hosting, mutation, fuzz, chaos, supply-chain and adversarial tests
        env:
          PYTHONPATH: python
        run: python -m unittest -v python.tests.test_hardness python.tests.test_hardness_properties python.tests.test_hardness_assurance python.tests.test_hardness_recovery python.tests.test_hardness_supply_chain python.tests.test_autoprompting python.tests.test_ggev2_hardness
      - name: Repository supply-chain preflight
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from rot_ai.hardness_supply_chain import scan_repository_supply_chain
          result = scan_repository_supply_chain(
              root=Path('.'),
              repo=os.environ['GITHUB_REPOSITORY'],
              ref=os.environ.get('GITHUB_HEAD_REF') or os.environ['GITHUB_REF_NAME'],
              candidate_sha=os.environ['GITHUB_SHA'],
          )
          print(f'supply-chain status={result.status} workflows={result.workflow_files} external_actions={result.external_actions}')
          for finding in result.findings:
              print(f'{finding.severity} {finding.code} {finding.path}: {finding.detail}')
          if result.status != 'PASS':
              raise SystemExit(1)
          PY
      - name: Authority boundary check
        run: |
          python - <<'PY'
          from pathlib import Path
          sources = [
              Path('python/rot_ai/hardness.py'),
              Path('python/rot_ai/hardness_assurance.py'),
              Path('python/rot_ai/hardness_recovery.py'),
              Path('python/rot_ai/hardness_supply_chain.py'),
              Path('python/rot_ai/autoprompting.py'),
              Path('python/rot_ai/ggev2_hardness.py'),
          ]
          forbidden = ['git push', 'merge_pull_request', 'update_ref(', 'accepted_event_writer']
          found=[]
          for path in sources:
              text=path.read_text()
              found.extend(f'{path}:{token}' for token in forbidden if token in text)
          if found:
              raise SystemExit(f'Hardness authority boundary violated: {found}')
          print('authority boundary: PASS')
          PY
      - name: Self-hosting manifest sanity
        run: |
          python - <<'PY'
          import json
          data=json.load(open('hardness/self-hosting-plan.v1.json'))
          assert data['hardness_level']=='H5'
          assert data['authority']=='DERIVED_POLICY_ONLY'
          assert data['promotion'].startswith('NO_GO')
          states={cp['id']:cp['state'] for cp in data['checkpoints']}
          assert states['CP-H4'] in {'ACTIVE','PASS'}
          assert states['CP-H5'] in {'NOT_RUN','PASS_CORE_EXACT_HEAD'}
          assert states['CP-H6'] in {'BLOCKED','PARTIAL_INTEGRATION_READY'}
          assert states.get('CP-H7') in {None,'BLOCKED_ON_EXECUTION'}
          print('self-hosting manifest: PASS')
          PY
