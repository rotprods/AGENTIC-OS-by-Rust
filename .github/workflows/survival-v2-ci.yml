name: Survival V2 Continuity Gate

on:
  pull_request:
    branches: [feat/f1-contract-kernel-vnext, feat/graph-refactor-v2-survival, main]
  push:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: survival-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Pin Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create isolated hash-locked Python verification environment
        run: |
          test "$(python --version | awk '{print $2}')" = "$PYTHON_VERSION"
          python -m venv /tmp/survival-v2-venv
          /tmp/survival-v2-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/continuity.txt
          /tmp/survival-v2-venv/bin/python -m pip check
      - name: Compile Python continuity surface
        run: /tmp/survival-v2-venv/bin/python -m compileall -q python/rot_contracts python/tests
      - name: Execute Survival V2 reference, recovery, coordination and schema tests
        env:
          PYTHONPATH: python
        run: /tmp/survival-v2-venv/bin/python -m unittest discover -s python/tests -v
      - name: Verify machine-readable state and canonical latest checkpoint
        env:
          PYTHONPATH: python
        run: |
          /tmp/survival-v2-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          from rot_contracts.continuity_files import (
              resolve_latest_checkpoint_path,
              verify_checkpoint_lineage_topology,
              verify_latest_checkpoint_binding,
          )

          root = Path('.')
          state_schema = json.loads((root / 'schemas/survival-project-state.v2.schema.json').read_text())
          checkpoint_schema = json.loads((root / 'schemas/survival-checkpoint.v2.schema.json').read_text())
          state = json.loads((root / 'state/project_state.json').read_text())

          errors = list(Draft202012Validator(state_schema, format_checker=FormatChecker()).iter_errors(state))
          if errors:
              raise SystemExit('state/project_state.json schema errors: ' + '; '.join(error.message for error in errors))

          checkpoint_path = resolve_latest_checkpoint_path(root, state)
          checkpoint = json.loads(checkpoint_path.read_text())
          errors = list(Draft202012Validator(checkpoint_schema, format_checker=FormatChecker()).iter_errors(checkpoint))
          if errors:
              raise SystemExit(f'{checkpoint_path} schema errors: ' + '; '.join(error.message for error in errors))
          verify_latest_checkpoint_binding(state, checkpoint)
          lineage = verify_checkpoint_lineage_topology(root, state)
          print(f'validated latest checkpoint: {checkpoint_path}')
          print(f'validated checkpoint lineage depth: {len(lineage)}')
          PY
