name: Survival V2 Continuity Gate

on:
  pull_request:
    branches: [feat/f1-contract-kernel-vnext, main]
  push:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: survival-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Compile Python continuity surface
        run: python -m compileall -q python/rot_contracts python/tests
      - name: Execute Survival V2 reference, recovery, coordination and schema tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
      - name: Verify machine-readable state and checkpoint schemas
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('.')
          pairs = [
              ('schemas/survival-project-state.v2.schema.json', 'state/project_state.json'),
              ('schemas/survival-checkpoint.v2.schema.json', 'state/checkpoints/cp5-survival-v2-20260829.json'),
          ]
          for schema_path, value_path in pairs:
              schema = json.loads((root / schema_path).read_text())
              value = json.loads((root / value_path).read_text())
              errors = list(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(value))
              if errors:
                  raise SystemExit(f'{value_path} schema errors: ' + '; '.join(error.message for error in errors))
          PY
