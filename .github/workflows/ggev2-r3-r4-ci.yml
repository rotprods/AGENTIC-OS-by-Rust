name: GGEV2 R3-R4 Swarm and Incident Engine

on:
  pull_request:
  push:
    branches: [feat/ggev2-r3-live-swarm]

permissions:
  contents: read

concurrency:
  group: ggev2-r3-r4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run GGEV2 R3/R4 tests
        env:
          PYTHONPATH: python
        run: |
          python -m unittest -v \
            python.tests.test_ggev2_swarm \
            python.tests.test_ggev2_incidents \
            python.tests.test_ggev2_collectors \
            python.tests.test_ggev2
      - name: Authority boundary static check
        run: |
          ! grep -R "authority_class.*CANONICAL\|promotion_authority.*true\|accepted_event.*true" python/rot_ai/ggev2_swarm.py python/rot_ai/ggev2_incidents.py
