name: Deterministic Invariant Gauntlet V2

on:
  push:
    branches: [feat/invariant-gauntlet-v2]
  pull_request:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: invariant-gauntlet-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariant-gauntlet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Compile invariant surface
        run: python -m compileall -q python/rot_contracts python/tests/test_invariant_gauntlet_v2.py
      - name: Execute deterministic seeded invariant corpus
        env:
          PYTHONPATH: python
        run: python -m unittest python.tests.test_invariant_gauntlet_v2 -v
