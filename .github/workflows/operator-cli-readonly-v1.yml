name: Survival Operator CLI Read-Only V1

on:
  push:
    branches: [feat/operator-cli-readonly-v2, feat/graph-refactor-v2-survival]
  pull_request:
    branches: [feat/graph-refactor-v2-survival]

permissions:
  contents: read

concurrency:
  group: operator-cli-readonly-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Prove dependency graph is unchanged
        run: |
          set -euxo pipefail
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "03b42bf650a8f52960ce8a92bc9f36848b215640ab58f4c673b09ddf5f05f370"
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --locked --format-version 1 >/dev/null
          cmp /tmp/Cargo.lock.before Cargo.lock
      - name: Formatting and clippy
        run: |
          cargo fmt --all --check
          cargo clippy -p rot-survival --all-targets --locked -- -D warnings
      - name: Operator CLI unit and integration tests
        run: cargo test -p rot-survival --all-targets --locked
      - name: Read-only smoke tests against canonical repository state
        run: |
          cargo run -q -p rot-survival --locked -- status > /tmp/operator-status.json
          cargo run -q -p rot-survival --locked -- doctor > /tmp/operator-doctor.json
          cargo run -q -p rot-survival --locked -- context > /tmp/operator-context.json
          python - <<'PY'
          import json
          for path in ['/tmp/operator-status.json','/tmp/operator-doctor.json','/tmp/operator-context.json']:
              payload=json.load(open(path))
              assert payload['ok'] is True, payload
              assert payload['output_authority']=='DERIVED_NON_AUTHORITATIVE', payload
          doctor=json.load(open('/tmp/operator-doctor.json'))
          assert doctor['checks']['writer_authority']=='UNQUALIFIED', doctor
          PY
      - name: Prove mutating commands remain fail-closed
        run: |
          set -euxo pipefail
          for command in init claim checkpoint handoff recover; do
            set +e
            cargo run -q -p rot-survival --locked -- "$command" >/tmp/cli-out 2>/tmp/cli-err
            rc=$?
            set -e
            test "$rc" -ne 0
            python - <<'PY'
          import json
          payload=json.load(open('/tmp/cli-err'))
          assert payload['code'] in {'AUTHORITY_UNQUALIFIED','CAPABILITY_UNQUALIFIED'}, payload
          PY
          done
          cmp /tmp/Cargo.lock.before Cargo.lock
