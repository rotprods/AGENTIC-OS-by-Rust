[workspace]
members = [
  "crates/rot-id",
  "crates/rot-contracts",
  "crates/rot-canonical-json",
  "crates/rot-hash",
  "crates/rot-temporal",
  "crates/rot-provenance",
  "crates/rot-event",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
